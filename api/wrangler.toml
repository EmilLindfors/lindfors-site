name = "newsletter-api"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"

[build]
# worker-build must be pinned to the worker crate's minor series. Unpinned, this
# installed whatever was newest, and the day worker-build 0.8.x shipped it began
# refusing to build against worker 0.7 ("expected at least worker@0.8.5") -- which
# broke `wrangler deploy` entirely, locally and in CI, with no change on our side.
# Two Windows-portability constraints, because wrangler runs this through cmd.exe
# there and through sh on Cloudflare's Linux builders:
#   - `&&`, not `;`. cmd.exe does not treat `;` as a separator, so cargo receives
#     `--locked;` as an argument and errors out.
#   - an exact version, not `^0.8`. `^` is cmd.exe's escape character, so `^0.8`
#     reaches cargo as `0.8`, which it rejects as an incomplete semver.
# cargo install exits 0 when that version is already present, so this is not a
# re-install on every build.
command = "cargo install worker-build --version 0.8.5 --locked && worker-build --release"

[vars]
SITE_URL = "https://lindfors.no"
STALWART_API_URL = "https://mail.lindfors.no"  # Adjust to your Stalwart instance
STALWART_LIST_ID = "news"                 # The mailing list principal name

# JMAP config for sending newsletters
JMAP_API_URL = "https://mail.lindfors.no:10443"
JMAP_ACCOUNT_ID = "c2"
JMAP_IDENTITY_ID = "b"

# Set these as secrets (npx wrangler secret put <NAME>):
# STALWART_API_KEY=
# ADMIN_KEY=
# JMAP_CREDENTIALS=  (base64 of postmaster@lindfors.no:PASSWORD)

# Route /api/* to this worker on the main domain
routes = [
    { pattern = "lindfors.no/api/*", zone_name = "lindfors.no" }
]
