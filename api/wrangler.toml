name = "newsletter-api"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"

[build]
# worker-build must be pinned to the worker crate's minor series. Unpinned, this
# installed whatever was newest, and the day worker-build 0.8.x shipped it began
# refusing to build against worker 0.7 ("expected at least worker@0.8.5") -- which
# broke `wrangler deploy` entirely, locally and in CI, with no change on our side.
# Two Windows-portability constraints, because wrangler runs this through cmd.exe
# there and through sh on Cloudflare's Linux builders:
#   - `&&`, not `;`. cmd.exe does not treat `;` as a separator, so cargo receives
#     `--locked;` as an argument and errors out.
#   - an exact version, not `^0.8`. `^` is cmd.exe's escape character, so `^0.8`
#     reaches cargo as `0.8`, which it rejects as an incomplete semver.
# cargo install exits 0 when that version is already present, so this is not a
# re-install on every build.
command = "cargo install worker-build --version 0.8.5 --locked && worker-build --release"

[vars]
SITE_URL = "https://lindfors.no"
# Everything now goes through JMAP. Stalwart 0.16 deleted the REST management API,
# so STALWART_API_URL / STALWART_API_KEY are gone: /api/principal/{id} 404s on both
# 443 and 8080 -- confirmed from localhost, so it was never the firewall. The code
# appends "/jmap/" to JMAP_API_URL.
JMAP_API_URL = "https://mail.lindfors.no"

# Sending: postmaster's account and identity, used by /api/send-newsletter.
JMAP_ACCOUNT_ID = "c2"
JMAP_IDENTITY_ID = "b"

# Subscriber list. This keys the `update` map in x:MailingList/set, so it must be the
# object *id*, not the name -- "news" is the name (address news@lindfors.no, alias
# newsletter@), and its id is "e". Confirmed against the live server; re-resolve with
# x:MailingList/get if the list is ever recreated, since ids are assigned on create.
STALWART_LIST_ID = "e"

# Not needed: x:MailingList/get and /set both succeed without an accountId, and echo
# back "bz" in the response. The code omits the key entirely while this is unset.
# STALWART_LIST_ACCOUNT_ID = "bz"

# The login for the list credential. Its password is the JMAP_LIST_PASSWORD secret,
# and the Worker base64s the pair itself -- storing a pre-encoded blob is what broke
# subscribe, since a bare password in the secret reads as a plain 401 and secrets
# cannot be read back to tell the two apart.
JMAP_LIST_USER = "emil@lindfors.no"

# Set these as secrets (npx wrangler secret put <NAME>):
# ADMIN_KEY=
# JMAP_CREDENTIALS=    (base64 of postmaster@lindfors.no:PASSWORD -- sending only,
#                       still pre-encoded; not migrated because that secret may
#                       currently be correct and re-encoding it would break sending)
# JMAP_LIST_PASSWORD=  (plain password or app password for JMAP_LIST_USER -- needs
#                       JMAP access plus sysMailingListUpdate + sysMailingListGet)

# Route /api/* to this worker on the main domain
routes = [
    { pattern = "lindfors.no/api/*", zone_name = "lindfors.no" }
]
