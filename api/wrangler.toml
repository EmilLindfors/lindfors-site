name = "newsletter-api"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"

# Route /api/* to this worker on the main domain.
#
# This has to sit above the first `[...]` header. TOML assigns a bare key to the
# table most recently opened, so while this lived at the end of the file it was not
# a top-level `routes` at all -- it was a variable named `routes` inside `[vars]`,
# and wrangler never said so because `[vars]` accepts any key. The live route came
# from the dashboard the whole time and this block was decorative. Adding
# `[[ratelimits]]` is what exposed it: those tables have a fixed schema, so the same
# misplaced key finally produced "Unexpected fields found in ratelimits[2]".
routes = [
    { pattern = "lindfors.no/api/*", zone_name = "lindfors.no" }
]

[build]
# worker-build must be pinned to the worker crate's minor series. Unpinned, this
# installed whatever was newest, and the day worker-build 0.8.x shipped it began
# refusing to build against worker 0.7 ("expected at least worker@0.8.5") -- which
# broke `wrangler deploy` entirely, locally and in CI, with no change on our side.
# Two Windows-portability constraints, because wrangler runs this through cmd.exe
# there and through sh on Cloudflare's Linux builders:
#   - `&&`, not `;`. cmd.exe does not treat `;` as a separator, so cargo receives
#     `--locked;` as an argument and errors out.
#   - an exact version, not `^0.8`. `^` is cmd.exe's escape character, so `^0.8`
#     reaches cargo as `0.8`, which it rejects as an incomplete semver.
# cargo install exits 0 when that version is already present, so this is not a
# re-install on every build.
command = "cargo install worker-build --version 0.8.5 --locked && worker-build --release"

# Workers Logs, on. Declared here rather than left to the dashboard, because a deploy
# overwrites remote config with this file -- the first deploy after adding the send log
# turned observability off, since absent here means disabled there.
#
# Load-bearing now: the event log and the welcome mail both fail *open* and report
# through console_error! alone, so with logs off their failures are invisible. The
# send-log claim fails closed and answers 503, which is at least visible to its caller.
[observability]
enabled = true

[vars]
SITE_URL = "https://lindfors.no"
# Everything now goes through JMAP. Stalwart 0.16 deleted the REST management API,
# so STALWART_API_URL / STALWART_API_KEY are gone: /api/principal/{id} 404s on both
# 443 and 8080 -- confirmed from localhost, so it was never the firewall. The code
# appends "/jmap/" to JMAP_API_URL.
JMAP_API_URL = "https://mail.lindfors.no"

# Sending: postmaster's account and identity, used by /api/send-newsletter.
JMAP_ACCOUNT_ID = "c2"
JMAP_IDENTITY_ID = "b"

# Subscriber list. This keys the `update` map in x:MailingList/set, so it must be the
# object *id*, not the name -- "news" is the name (address news@lindfors.no, alias
# newsletter@), and its id is "e". Confirmed against the live server; re-resolve with
# x:MailingList/get if the list is ever recreated, since ids are assigned on create.
STALWART_LIST_ID = "e"

# Not needed: x:MailingList/get and /set both succeed without an accountId, and echo
# back "bz" in the response. The code omits the key entirely while this is unset.
# STALWART_LIST_ACCOUNT_ID = "bz"

# The login for the list credential. Its password is the JMAP_LIST_PASSWORD secret,
# and the Worker base64s the pair itself -- storing a pre-encoded blob is what broke
# subscribe, since a bare password in the secret reads as a plain 401 and secrets
# cannot be read back to tell the two apart.
JMAP_LIST_USER = "emil@lindfors.no"

# Set these as secrets (npx wrangler secret put <NAME>):
# ADMIN_KEY=
# CONFIRM_SECRET=      (openssl rand -hex 32 -- the HMAC key for double opt-in
#                       confirmation links. Rotating it invalidates every link that
#                       has not been clicked yet, which is at most 48 hours' worth
#                       and is the entire revocation story; there is no issued-token
#                       list to walk.)
# JMAP_CREDENTIALS=    (base64 of postmaster@lindfors.no:PASSWORD -- sending only,
#                       still pre-encoded; not migrated because that secret may
#                       currently be correct and re-encoding it would break sending)
# JMAP_LIST_PASSWORD=  (plain password or app password for JMAP_LIST_USER -- needs
#                       JMAP access plus sysMailingListUpdate + sysMailingListGet)

# ---------------------------------------------------------------------------
# Rate limiting
# ---------------------------------------------------------------------------
#
# Part of double opt-in, not a follow-up to it. /api/subscribe used to add a row;
# it now makes this server send mail to whatever address a stranger types, so
# unrated it is a mail bomb anyone can aim at anyone -- from a self-hosted sender
# whose reputation is the only thing making delivery work at all.
#
# These are Workers rate limiting bindings, which run at the edge and need no WAF
# or paid plan. `period` accepts only 10 or 60, so what they bound is burst rate,
# not daily volume: a caller pacing itself under the limit still trickles through.
# That ceiling is the mechanism's, not a misconfiguration. Sustained-abuse limits
# want a WAF custom rule, which lives in the dashboard rather than here.
#
# The Worker fails closed if a binding is missing -- see rate_limit_allows() -- so
# deleting one of these breaks signup loudly instead of quietly unprotecting it.
# namespace_id is an arbitrary but stable per-binding integer; changing one resets
# its counters.

# One source spraying confirmation mail at many addresses.

# Send log: one file per sent issue, in a WebDAV collection on the same Stalwart the
# newsletter already goes through. The Worker claims a slug with `PUT` +
# `If-None-Match: *`, which Stalwart answers with 412 when the file exists -- so a send
# whose response was lost cannot be retried into a double send.
#
# The account component is the **URL-encoded email address**, not a bare local part.
# A wrong account 404s on every method, which looks nothing like a permissions problem.
# Discover them with: PROPFIND /dav/file/ -H "Depth: 1".
#
# Authenticated as JMAP_LIST_USER, which therefore needs DAV file access on this path.
# Verified end to end with `site-tools newsletter check-sendlog`: 201 on a fresh slug,
# 412 on the same slug again, 204 on delete.
SEND_LOG_URL = "https://mail.lindfors.no/dav/file/emil%40lindfors.no/newsletter-sent"

# Event log: one file per subscribe/confirm/unsubscribe, same collection pattern. The
# address is stored as an HMAC under EVENT_LOG_SECRET -- which must NOT be
# CONFIRM_SECRET, since that one is meant to be rotated and a rotation would orphan
# every event ever written.
#
# Writing it FAILS OPEN: refusing someone's unsubscribe because an audit trail could not
# be written would be indefensible. Compare the send-log claim, which fails closed.
EVENT_LOG_URL = "https://mail.lindfors.no/dav/file/emil%40lindfors.no/newsletter-events"

[[ratelimits]]
name = "SUBSCRIBE_IP_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Many sources converging on one inbox. Keyed on the address, so it holds however
# the requests are distributed. Tighter than the IP limit: a real person submits
# the form once, and twice only if they think it failed.
[[ratelimits]]
name = "SUBSCRIBE_EMAIL_LIMITER"
namespace_id = "1002"
simple = { limit = 2, period = 60 }

# /api/unsubscribe and /api/confirm, keyed per route and IP. Looser, because these
# do not send mail -- the point is bounding JMAP calls, not preventing abuse of an
# inbox.
[[ratelimits]]
name = "API_IP_LIMITER"
namespace_id = "1003"
simple = { limit = 15, period = 60 }

