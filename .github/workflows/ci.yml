name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          # Templates use Tera v2 syntax (components, no macros) — requires 0.23+.
          ZOLA_VERSION="0.23.2"
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv zola /usr/local/bin/

      - name: Check Zola site
        run: zola check

      - name: Build Zola site
        run: zola build

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress public/
          fail: false

  test-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/site-tools/target
          key: ${{ runner.os }}-tools-${{ hashFiles('tools/site-tools/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-tools-

      - name: Test site-tools
        working-directory: tools/site-tools
        run: cargo test

      # 22 or newer: the middleware is plain .js with ESM syntax, and Node only
      # detects that without a "type": "module" from 22.7 on. A package.json in
      # functions/ would fix it too, but that directory is Cloudflare's to interpret.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test blog content negotiation
        run: node --test tools/tests/middleware.test.mjs

  check-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('api/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check Worker compiles
        working-directory: api
        run: cargo check --target wasm32-unknown-unknown

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        working-directory: api
        run: cargo audit
