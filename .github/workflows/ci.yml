name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          # Templates use Tera v2 syntax (components, no macros) — requires 0.23+.
          ZOLA_VERSION="0.23.2"
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv zola /usr/local/bin/

      - name: Check Zola site
        run: zola check

      - name: Build Zola site
        run: zola build

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress public/
          fail: false

  test-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/site-tools/target
            tools/img-optim/target
          key: ${{ runner.os }}-tools-${{ hashFiles('tools/*/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-tools-

      - name: Test site-tools
        working-directory: tools/site-tools
        run: cargo test

      # The publisher on mail.lindfors.no is this crate without `cite`, the one feature
      # that pulls in C. Built here so a dependency added to the wrong side of the
      # feature line fails in CI and not on the box's next cross-compile.
      - name: Check the publisher build (no default features)
        working-directory: tools/site-tools
        run: cargo build --no-default-features

      # img-optim is run by hand when an image is added to a post, so nothing in a
      # build calls it. Without this it is the one crate here that can stop compiling
      # without anyone noticing until the next time an image needs converting.
      - name: Test img-optim
        working-directory: tools/img-optim
        run: cargo test

      # 22 or newer: the middleware is plain .js with ESM syntax, and Node only
      # detects that without a "type": "module" from 22.7 on. A package.json in
      # functions/ would fix it too, but that directory is Cloudflare's to interpret.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test blog content negotiation
        run: node --test tools/tests/middleware.test.mjs

  test-newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            newsletter/target
          key: ${{ runner.os }}-newsletter-${{ hashFiles('newsletter/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-newsletter-

      # The halves that can be checked without a live Postgres, Stalwart or Kanidm:
      # the signed links, address validation, the rate limiter, the mail templates and
      # JMAP request shapes, the SQL text, the derived CSP. The network paths are thin
      # wrappers so that this covers most of the logic.
      - name: Test newsletter service
        working-directory: newsletter
        run: cargo test

      - name: Check newsletter service builds
        working-directory: newsletter
        run: cargo build --release

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test dashboard scripts
        working-directory: newsletter
        run: node --test tests/admin-auth.test.mjs tests/admin-readers.test.mjs
