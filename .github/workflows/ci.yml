name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          # Templates use Tera v2 syntax (components, no macros) — requires 0.23+.
          ZOLA_VERSION="0.23.2"
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv zola /usr/local/bin/

      - name: Check Zola site
        run: zola check

      - name: Build Zola site
        run: zola build

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress public/
          fail: false

  # The generators moved to github.com/EmilLindfors/site-tools on 2026-09-12 and are
  # tested by that repository's own CI. What is left here is the one piece of code the
  # site itself ships: the Pages Function that content-negotiates /blog/*.
  test-middleware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22 or newer: the middleware is plain .js with ESM syntax, and Node only
      # detects that without a "type": "module" from 22.7 on. A package.json in
      # functions/ would fix it too, but that directory is Cloudflare's to interpret.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test blog content negotiation
        run: node --test tests/middleware.test.mjs
