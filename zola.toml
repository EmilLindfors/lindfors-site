# The URL the site will be built for
base_url = "https://lindfors.no"

# Site title and description
title = "lindfors.no"
description = "Writings on aquaculture, Rust programming, sensors, and scientific topics"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

# Generate Atom feed
generate_feeds = true
feed_filenames = ["atom.xml"]

# Zola 0.23+ runs page content through Tera before markdown, so any `{{ ... }}`
# or `{% ... %}` in a post -- including inside fenced code blocks, which are NOT
# exempt -- is executed as template syntax. These posts quote Tera source
# throughout, so templating is disabled for them. Note: a post listed here
# cannot use Tera components in its content.
skip_content_templating = [
    "blog/building-a-personal-blog-with-zola/index.md",
    "blog/citations-on-a-static-site/index.md",
]

# Taxonomies
taxonomies = [
    { name = "tags", feed = true },
    { name = "categories", feed = true },
]

[markdown]

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
# Author information
author = "Emil Lindfors"
author_email = "emil@lindfors.no"
author_bio = "Researcher working on aquaculture innovation, sensor systems, and sustainable technology. Writing about Rust, science, and the intersection of technology and nature."

# Social links (optional)
github = "https://github.com/emillindfors"
linkedin = "https://linkedin.com/in/emil-havbruk"

# Enable KaTeX math rendering
katex = true

# Enable table of contents by default
toc = true

# Newsletter (Pages Function backed by D1)
newsletter_endpoint = "/api/subscribe"

# Default OG image (place a 1200x630 image at static/og-default.png)
og_image = "/og-default.png"
