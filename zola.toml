# The URL the site will be built for
base_url = "https://lindfors.no"

# Site title and description
title = "lindfors.no"
description = "Agent-powered data platforms, Rust, and innovation theory applied to new technology. By Emil Lindfors, AI capability lead and senior data engineer in Oslo."

# Top-level, not extra: the built-in atom.xml reads config.author and falls back to
# printing "Unknown" without it. Templates use config.author too, so there is one
# source of truth. author_email / author_bio stay in extra -- Zola has no field for them.
author = "Emil Lindfors"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

# Generate Atom feed
generate_feeds = true
feed_filenames = ["atom.xml"]

# Zola 0.23+ runs page content through Tera before markdown, so any `{{ ... }}`
# or `{% ... %}` in a post -- including inside fenced code blocks, which are NOT
# exempt -- is executed as template syntax. These posts quote Tera source
# throughout, so templating is disabled for them. Note: a post listed here
# cannot use Tera components in its content.
skip_content_templating = [
    "blog/building-a-personal-blog-with-zola/index.md",
    "blog/citations-on-a-static-site/index.md",
    "blog/audio-on-a-static-site/index.md",
]

# Taxonomies
# `series` carries only the series title; position and length are derived at render
# time from publication date and the number of posts sharing the term (see
# templates/components.html, series.parts). Writing a part number into a post would
# have to be re-edited in every later post when one is inserted.
taxonomies = [
    { name = "tags", feed = true },
    { name = "categories", feed = true },
    { name = "series", feed = true },
]

[markdown]

[markdown.highlighting]
theme = "catppuccin-mocha"

[link_checker]
# The DOIs themselves are fine -- doi.org resolves them with a 302. It is the
# publishers behind it (MDPI, Taylor & Francis) that return 403 to anything without a
# browser User-Agent, so every cited DOI reads as broken. Nothing to fix on our side.
skip_prefixes = ["https://doi.org/"]

# Don't fail the build because a third-party site is unreachable -- `zola check` runs
# in CI, and an external outage is not a defect in this repo. Internal links and
# anchors stay at the default "error", since those are ours to get right.
external_level = "warn"

[extra]
# Author information (see top-level `author` for the name)
author_email = "emil@lindfors.no"
author_bio = "AI capability lead and senior data engineer at a data platform consultancy in Oslo, with a PhD in innovation studies. Writes about agent-powered pipelines, talking to your data, coding agents, Rust, and what innovation theory says about all of it."

# Social links (optional)
github = "https://github.com/emillindfors"
linkedin = "https://linkedin.com/in/emil-havbruk"

# Enable KaTeX math rendering
katex = true

# Enable table of contents by default
toc = true

# Newsletter (Pages Function backed by D1)
newsletter_endpoint = "/api/subscribe"

# Default OG image (place a 1200x630 image at static/og-default.png)
og_image = "/og-default.png"

# Real user monitoring, sent to the self-hosted OpenObserve on logs.lindfors.no.
# Absent or `enabled = false` ships no script at all, so this is off until an
# application exists in OpenObserve (Management -> RUM) to fill the two ids in.
#
# `client_token` is public by design: a write-only ingest key that appears in the
# source of every page. It is not a secret and does not belong in wrangler vars.
# `site` is the ingest *host*, without a scheme -- the SDK builds
# https://<site>/rum/<api_version>/<organization>/rum itself. Adding a host here
# means adding it to connect-src in static/_headers too.
[extra.rum]
enabled = true
site = "logs.lindfors.no"
organization = "default"
application_id = "lindfors-site"
client_token = "rumS0CkqQm8C0TQ4jv4"
service = "lindfors-site"
env = "production"
# Percentage of sessions collected. This is applied by static/js/rum.js *before* it
# fetches the 61 KB SDK, not by the SDK afterwards, so turning it down saves the
# download for everyone it excludes rather than only the ingest. The SDK's own
# sessionSampleRate is pinned at 100 for that reason -- sampling in both places
# would multiply the two rates together.
session_sample_rate = 100

# Per-resource timing: one ~60-field record for every css, font, image and script on
# every view, which measured out at 82% of all RUM volume and six of every seven
# events. On a site whose assets are immutable and cache-busted, that is the same
# measurement repeated -- the SDK even times its own download. The view events keep
# first paint, LCP and a resource *count* without it. Turn it on for a week when
# something specific looks slow, then turn it off again.
track_resources = false
# Optional. Set it to something that identifies a deploy if you want errors keyed to
# one; left empty the SDK simply reports no version.
version = ""
