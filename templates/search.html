{% extends "base.html" %}

{% block title %}Search | {{ config.title }}{% endblock %}

{% block content %}
<section class="search-page">
    <div class="search-header">
        <h1>Search</h1>
        <form role="search" id="search-form" class="search-input-wrapper">
            <svg class="search-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="search-input" class="search-input" placeholder="Search posts..." autofocus aria-label="Search posts">
        </form>
    </div>
    <div id="search-results" class="search-results"></div>
</section>

<script src="{{ get_url(path='elasticlunr.min.js') }}"></script>
<script src="{{ get_url(path='search_index.en.js') }}"></script>
<script src="{{ get_url(path='js/search.js') }}"></script>
{% endblock %}
